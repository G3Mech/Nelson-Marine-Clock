<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nelson Marine — Job Clock</title>
<style>
  :root{
    --ink:#0f2438;
    --deep:#0a1a2b;
    --slate:#3d5568;
    --line:#d7dfe4;
    --paper:#f3f6f7;
    --white:#ffffff;
    --go:#1c6e4a;
    --go-dark:#154f37;
    --stop:#8a2f1f;
    --stop-dark:#6c2417;
    --amber:#a5690a;
    --amber-bg:#fbf1de;
    --slip-accent:#1c4f72;
    --slip-bg:#eaf2f7;
    --yard-accent:#8a5a2b;
    --yard-bg:#f7f0e4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .frame{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:var(--white);
    display:flex;
    flex-direction:column;
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }

  .demo-strip{
    background:var(--deep);
    color:#cfe0ea;
    font-size:12px;
    padding:8px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    letter-spacing:.02em;
  }
  .demo-strip button{
    background:none;
    border:1px solid #385065;
    color:#cfe0ea;
    font-size:11px;
    padding:4px 9px;
    border-radius:20px;
    cursor:pointer;
  }
  .demo-strip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;position:relative;top:-1px;}
  .dot.on{background:#4fd18b;}
  .dot.off{background:#e0705a;}

  header{
    padding:16px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  .yard{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.14em;
    color:var(--slate);
    font-weight:600;
    margin-bottom:8px;
  }
  select#locSelect{
    width:100%;
    font-size:16px;
    font-weight:600;
    padding:10px 12px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
  }
  select#locSelect:disabled{opacity:.55;}

  .lock-note{
    font-size:12px;
    color:var(--stop);
    margin-top:8px;
    display:none;
  }
  .lock-note.show{display:block;}

  .boat-card{
    margin:14px 20px 0;
    border:1px solid var(--line);
    border-left:4px solid var(--slate);
    border-radius:10px;
    padding:14px 16px;
  }
  .boat-card.slip{border-left-color:var(--slip-accent);}
  .boat-card.yard{border-left-color:var(--yard-accent);}
  .type-badge{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    letter-spacing:.08em;
    padding:3px 8px;
    border-radius:5px;
    margin-bottom:8px;
  }
  .type-badge.slip{background:var(--slip-bg);color:var(--slip-accent);}
  .type-badge.yard{background:var(--yard-bg);color:var(--yard-accent);}
  .boat-customer{font-size:18px;font-weight:700;}
  .boat-model{font-size:13px;color:var(--slate);margin-top:2px;}
  .boat-wo{font-size:12px;color:var(--slate);margin-top:6px;font-weight:600;}

  .now-timing{
    margin:14px 20px 0;
    background:var(--go);
    color:var(--white);
    border-radius:10px;
    padding:12px 16px;
    display:none;
    align-items:center;
    justify-content:space-between;
  }
  .now-timing.show{display:flex;}
  .now-timing .nt-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.85;}
  .now-timing .nt-task{font-size:15px;font-weight:700;margin-top:2px;}
  .now-timing .nt-time{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;}
  .now-timing button{
    background:var(--white);
    color:var(--go-dark);
    border:none;
    font-weight:700;
    padding:9px 16px;
    border-radius:8px;
    font-size:13px;
    margin-left:10px;
    cursor:pointer;
  }

  .checklist{
    margin:16px 20px 0;
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .task-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .task-row:last-child{border-bottom:none;}
  .task-row.pending{background:var(--white);}
  .task-row.pending:active{background:var(--paper);}
  .task-row.active{background:var(--go);}
  .task-row.active .task-name{color:var(--white);font-weight:700;}
  .task-row.active .task-sub{color:#d6ecdf;}
  .task-row.done{background:var(--paper);cursor:default;}
  .task-row.locked{cursor:default;opacity:.5;}

  .task-name{font-size:15px;font-weight:600;}
  .task-sub{font-size:12px;color:var(--slate);margin-top:2px;}
  .task-row.done .task-name{text-decoration:line-through;color:var(--slate);font-weight:500;}

  .task-action{
    font-size:12px;
    font-weight:700;
    padding:6px 12px;
    border-radius:20px;
    white-space:nowrap;
    flex-shrink:0;
    margin-left:10px;
  }
  .task-action.start{background:var(--slip-bg);color:var(--go);border:1px solid var(--go);}
  .task-action.check{background:none;color:var(--go);font-size:18px;padding:0;}

  section.log{
    border-top:1px solid var(--line);
    margin-top:22px;
    padding:18px 20px 30px;
  }
  section.log h2{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--slate);
    margin:0 0 12px;
  }
  .entry{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .entry:last-child{border-bottom:none;}
  .entry .meta{color:var(--slate);font-size:12px;margin-top:2px;}
  .pill{
    font-size:11px;
    font-weight:600;
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .pill.synced{background:#e3f2ea;color:var(--go);}
  .pill.pending{background:var(--amber-bg);color:var(--amber);}
  .empty{color:var(--slate);font-size:13px;padding:6px 0 2px;}

  .whoami{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--slate);
    padding:12px 20px 0;
  }
  .whoami button{
    border:none;
    background:none;
    color:var(--slate);
    text-decoration:underline;
    font-size:12px;
    padding:0;
    cursor:pointer;
  }

  .setup-overlay{
    position:fixed;
    inset:0;
    background:rgba(10,26,43,0.55);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:10;
  }
  .setup-sheet{
    background:var(--white);
    width:100%;
    max-width:460px;
    border-radius:20px 20px 0 0;
    padding:26px 22px 34px;
  }
  .setup-sheet h3{margin:0 0 4px;font-size:19px;}
  .setup-sheet p{margin:0 0 18px;font-size:13px;color:var(--slate);}
  .name-btn{
    width:100%;
    text-align:left;
    padding:15px 16px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--white);
    font-size:15px;
    font-weight:600;
    margin-bottom:9px;
    cursor:pointer;
    color:var(--ink);
  }
  .name-btn:active{background:var(--paper);}
</style>
</head>
<body>
<div class="frame">

  <div class="demo-strip">
    <span><span class="dot on" id="dot"></span><span id="netlabel">Online — testing mode</span></span>
    <button id="toggleNet">Simulate signal drop</button>
  </div>

  <div class="whoami">
    Logged in as <strong id="whoName">—</strong>
    <button id="switchUser">not you?</button>
  </div>

  <header>
    <div class="yard">Nelson Marine · Job Clock</div>
    <select id="locSelect">
      <optgroup label="Slips — In Water">
        <option value="slip14">Slip 14</option>
        <option value="slip22">Slip 22</option>
      </optgroup>
      <optgroup label="Yard — On Stands">
        <option value="yardC6">Yard Row C, Stand 6</option>
      </optgroup>
    </select>
    <div class="lock-note" id="lockNote">Finish or mark your current task done before switching jobs</div>
  </header>

  <div class="boat-card" id="boatCard">
    <span class="type-badge" id="typeBadge"></span>
    <div class="boat-customer" id="boatCustomer"></div>
    <div class="boat-model" id="boatModel"></div>
    <div class="boat-wo" id="boatWO"></div>
  </div>

  <div class="now-timing" id="nowTiming">
    <div>
      <div class="nt-label">Now timing</div>
      <div class="nt-task" id="ntTask">—</div>
    </div>
    <div style="display:flex;align-items:center;">
      <div class="nt-time" id="ntTime">00:00</div>
      <button id="ntDoneBtn">Done</button>
    </div>
  </div>

  <div class="checklist" id="checklist"></div>

  <section class="log">
    <h2>Today, all jobs</h2>
    <div id="logList"><div class="empty">No entries yet</div></div>
  </section>
</div>

<div class="setup-overlay" id="setupOverlay">
  <div class="setup-sheet">
    <h3>Who's clocking in?</h3>
    <p>One-time setup — this phone will remember you after this.</p>
    <button class="name-btn" data-name="Gordon">Gordon</button>
    <button class="name-btn" data-name="Nick">Nick</button>
    <button class="name-btn" data-name="Cory">Cory</button>
    <button class="name-btn" data-name="Doug">Doug</button>
  </div>
</div>

<script>
const locations = {
  slip14: {
    type:'slip', label:'Slip 14 — In Water',
    customer:'R. Alvarez', boat:'Sea Ray 240 Sundancer', wo:'WO #4471',
    tasks:[
      {id:'t1', name:'Impeller replacement', status:'pending'},
      {id:'t2', name:'Oil & filter change', status:'pending'},
      {id:'t3', name:'Check shaft packing', status:'pending'}
    ]
  },
  slip22: {
    type:'slip', label:'Slip 22 — In Water',
    customer:'T. Nguyen', boat:'Grady-White 236', wo:'WO #4483',
    tasks:[
      {id:'t1', name:'Hull cleaning', status:'pending'},
      {id:'t2', name:'Zinc replacement', status:'pending'},
      {id:'t3', name:'Prop inspection', status:'pending'}
    ]
  },
  yardC6: {
    type:'yard', label:'Yard Row C, Stand 6',
    customer:'M. Castellano', boat:'Boston Whaler 22 Outrage', wo:'WO #4462',
    tasks:[
      {id:'t1', name:'Sand bottom', status:'pending'},
      {id:'t2', name:'Apply barrier coat', status:'pending'},
      {id:'t3', name:'Bottom paint — 2 coats', status:'pending'}
    ]
  }
};

let currentUser = null;
let currentLoc = 'slip14';
let activeTask = null;
let isOnline = true;
let ticker = null;
let audioCtx = null;

const overlay = document.getElementById('setupOverlay');
const whoName = document.getElementById('whoName');
const locSelect = document.getElementById('locSelect');
const lockNote = document.getElementById('lockNote');
const typeBadge = document.getElementById('typeBadge');
const boatCard = document.getElementById('boatCard');
const boatCustomer = document.getElementById('boatCustomer');
const boatModel = document.getElementById('boatModel');
const boatWO = document.getElementById('boatWO');
const nowTiming = document.getElementById('nowTiming');
const ntTask = document.getElementById('ntTask');
const ntTime = document.getElementById('ntTime');
const ntDoneBtn = document.getElementById('ntDoneBtn');
const checklist = document.getElementById('checklist');
const logList = document.getElementById('logList');
const dot = document.getElementById('dot');
const netlabel = document.getElementById('netlabel');

function getCtx(){
  if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
  if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
  return audioCtx;
}
function tone(ctx, freq, startAt, dur){
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, startAt);
  g.gain.exponentialRampToValueAtTime(0.32, startAt + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, startAt + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(startAt); o.stop(startAt + dur + 0.02);
}
function playStartSound(){
  const ctx = getCtx();
  tone(ctx, 880, ctx.currentTime, 0.16);
}
function playDoneSound(){
  const ctx = getCtx();
  tone(ctx, 660, ctx.currentTime, 0.14);
  tone(ctx, 440, ctx.currentTime + 0.13, 0.20);
}

document.querySelectorAll('.name-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentUser = btn.dataset.name;
    whoName.textContent = currentUser;
    overlay.style.display = 'none';
  });
});
document.getElementById('switchUser').addEventListener('click', ()=>{
  overlay.style.display = 'flex';
});

document.getElementById('toggleNet').addEventListener('click', ()=>{
  isOnline = !isOnline;
  dot.className = 'dot ' + (isOnline ? 'on' : 'off');
  netlabel.textContent = isOnline ? 'Online — testing mode' : 'No signal — testing mode';
  if (isOnline) syncPending();
  renderLog();
});

locSelect.addEventListener('change', (e)=>{
  if (activeTask){
    e.target.value = currentLoc;
    lockNote.classList.add('show');
    setTimeout(()=>lockNote.classList.remove('show'), 2200);
    return;
  }
  currentLoc = e.target.value;
  renderBoatCard();
  renderChecklist();
});

function renderBoatCard(){
  const loc = locations[currentLoc];
  boatCard.className = 'boat-card ' + loc.type;
  typeBadge.className = 'type-badge ' + loc.type;
  typeBadge.textContent = loc.type === 'slip' ? 'SLIP · DOCKSIDE' : 'YARD · ON STANDS';
  boatCustomer.textContent = loc.customer;
  boatModel.textContent = loc.boat;
  boatWO.textContent = loc.wo + ' — ' + loc.label;
}

function fmtDuration(ms){
  const secs = Math.floor(ms/1000);
  const m = String(Math.floor(secs/60)).padStart(2,'0');
  const s = String(secs%60).padStart(2,'0');
  return m + ':' + s;
}
function fmtClock(d){ return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }

function renderChecklist(){
  const loc = locations[currentLoc];
  checklist.innerHTML = loc.tasks.map(t=>{
    if (t.status === 'done'){
      const mins = Math.round((t.end - t.start)/60000);
      return '<div class="task-row done">' +
        '<div><div class="task-name">' + t.name + '</div>' +
        '<div class="task-sub">' + fmtClock(t.start) + '–' + fmtClock(t.end) + ' · ' + mins + ' min</div></div>' +
        '<span class="task-action check">&#10003;</span></div>';
    }
    if (t.status === 'active'){
      return '<div class="task-row active" data-task="' + t.id + '">' +
        '<div><div class="task-name">' + t.name + '</div>' +
        '<div class="task-sub">in progress</div></div></div>';
    }
    const locked = activeTask ? 'locked' : '';
    return '<div class="task-row pending ' + locked + '" data-task="' + t.id + '">' +
      '<div><div class="task-name">' + t.name + '</div></div>' +
      '<span class="task-action start">Start</span></div>';
  }).join('');

  checklist.querySelectorAll('.task-row').forEach(row=>{
    row.addEventListener('click', ()=>onTaskTap(row.dataset.task));
  });

  updateNowTiming();
}

function onTaskTap(taskId){
  if (!currentUser){ overlay.style.display = 'flex'; return; }
  const loc = locations[currentLoc];
  const task = loc.tasks.find(t=>t.id===taskId);
  if (!task) return;

  if (task.status === 'pending'){
    if (activeTask) return;
    task.status = 'active';
    task.start = new Date();
    activeTask = { locId: currentLoc, taskId: task.id };
    playStartSound();
    renderChecklist();
    startTicker();
  } else if (task.status === 'active'){
    finishTask(currentLoc, task.id);
  }
}

function finishTask(locId, taskId){
  const loc = locations[locId];
  const task = loc.tasks.find(t=>t.id===taskId);
  task.status = 'done';
  task.end = new Date();
  task.synced = isOnline;
  task.employee = currentUser;
  task.jobLabel = loc.customer + ' — ' + loc.boat;
  activeTask = null;
  playDoneSound();
  stopTicker();
  renderChecklist();
  renderLog();
  if (isOnline) syncPending();
}

ntDoneBtn.addEventListener('click', ()=>{
  if (activeTask) finishTask(activeTask.locId, activeTask.taskId);
});

function updateNowTiming(){
  if (!activeTask){
    nowTiming.classList.remove('show');
    return;
  }
  const loc = locations[activeTask.locId];
  const task = loc.tasks.find(t=>t.id===activeTask.taskId);
  ntTask.textContent = task.name + ' · ' + loc.customer;
  nowTiming.classList.add('show');
}

function startTicker(){
  stopTicker();
  ticker = setInterval(()=>{
    if (!activeTask) return;
    const loc = locations[activeTask.locId];
    const task = loc.tasks.find(t=>t.id===activeTask.taskId);
    ntTime.textContent = fmtDuration(new Date() - task.start);
  }, 1000);
}
function stopTicker(){ clearInterval(ticker); ntTime.textContent = '00:00'; }

function renderLog(){
  const all = [];
  Object.values(locations).forEach(loc=>{
    loc.tasks.forEach(t=>{
      if (t.status === 'done') all.push(t);
    });
  });
  all.sort((a,b)=> b.end - a.end);

  if (all.length === 0){
    logList.innerHTML = '<div class="empty">No entries yet</div>';
    return;
  }
  logList.innerHTML = all.map(t=>
    '<div class="entry"><div><div>' + t.employee + ' — ' + t.name + '</div>' +
    '<div class="meta">' + t.jobLabel + ' · ' + fmtClock(t.start) + '–' + fmtClock(t.end) + '</div></div>' +
    '<span class="pill ' + (t.synced ? 'synced' : 'pending') + '">' + (t.synced ? 'Synced' : 'Pending') + '</span></div>'
  ).join('');
}

function syncPending(){
  let changed = false;
  Object.values(locations).forEach(loc=>{
    loc.tasks.forEach(t=>{
      if (t.status === 'done' && !t.synced){ t.synced = true; changed = true; }
    });
  });
  if (changed) renderLog();
}

overlay.style.display = 'flex';
renderBoatCard();
renderChecklist();
renderLog();
</script>
</body>
</html>
